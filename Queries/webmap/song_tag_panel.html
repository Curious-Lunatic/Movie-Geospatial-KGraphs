<details class="song-tag-panel" id="songTagPanel"><summary>Propose a song location or scene geotag <span>Evidence review required</span></summary><div class="song-tag-content"><p>Choose a recorded song, identify the place and explain the song-specific evidence. Download a proposal for review; it is not automatically added to the accepted knowledge graph.</p><form id="songTagForm">
 <label for="songTagSearch">Find a song or its film</label><input id="songTagSearch" autocomplete="off" placeholder="Gerua, Dilwale, Chaiyya Chaiyya…"><div id="songTagChoices"></div><p id="songTagSelected" role="status">No song selected.</p>
 <label for="songTagPlace">Place name</label><input id="songTagPlace" maxlength="200" required placeholder="Use the actual site, locality, country or railway name"><button id="songTagUsePoint" type="button">Use the selected map point</button>
 <div class="year-inputs"><div><label for="songTagLat">Latitude</label><input id="songTagLat" type="number" min="-90" max="90" step="any" required></div><div><label for="songTagLon">Longitude</label><input id="songTagLon" type="number" min="-180" max="180" step="any" required></div></div>
 <label for="songTagPrecision">What does this coordinate represent?</label><select id="songTagPrecision"><option value="unknown_reference">Uncertain / needs review</option value="site_reference">Named site reference point</option><option value="route_reference">Route / railway reference point</option><option value="locality_reference">City / locality reference point</option><option value="country_reference">Country reference point</option></select>
 <label for="songTagSource">Song video or source evidence URL</label><input id="songTagSource" type="url" required placeholder="https://…"><label for="songTagTime">Scene timestamp, if known</label><input id="songTagTime" placeholder="01:23 or 00:01:23"><label for="songTagEvidence">Explain why the evidence identifies this song and place</label><textarea id="songTagEvidence" minlength="20" maxlength="2000" required rows="3"></textarea><button type="submit">Download proposed geotag · JSON</button><p id="songTagStatus" role="status"></p>
 </form><p id="songReviewCount" class="control-note"></p></div></details>
